services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mktask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mktask}
      POSTGRES_DB: ${POSTGRES_DB:-mktask_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mktask}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mktask-network
    ports:
      - "5435:5432"

  # Redis for Bull Queue
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mktask-network
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Application (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file:
      - .env
    environment:
      # Override for Docker (uses service names instead of localhost)
      DATABASE_URL: postgresql://${POSTGRES_USER:-mktask}:${POSTGRES_PASSWORD:-mktask}@postgres:5432/${POSTGRES_DB:-mktask_db}
      REDIS_HOST: redis
      # Frontend environment variable for API connection
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:3000" # Backend API → http://localhost:8080
      - "8081:3001" # Frontend   → http://localhost:8081
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mktask-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local

networks:
  mktask-network:
    driver: bridge
